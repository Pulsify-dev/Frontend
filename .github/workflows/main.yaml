name: Deploy Pulsify Frontend

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build \
            --build-arg VITE_API_URL="${{ secrets.VITE_API_URL }}" \
            --build-arg VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" \
            --build-arg VITE_USE_MOCKS=false \
            --build-arg VITE_USE_MOCK=false \
            --build-arg VITE_USE_MOCK_API=false \
            --build-arg VITE_RECAPTCHA_SITE_KEY="${{secrets.VITE_RECAPTCHA_SITE_KEY}}" \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{secrets.VITE_GOOGLE_CLIENT_ID}}" \
            -t ${{ secrets.DOCKER_HUB_USERNAME }}/pulsify-frontend:latest \
            ./my-app
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/pulsify-frontend:latest

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_IP }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/pulsify-frontend:latest
            sudo docker stop pulsify-web-1 pulsify-web-2 pulsify-web-3 || true
            sudo docker rm pulsify-web-1 pulsify-web-2 pulsify-web-3 || true
            sudo docker run -d \
              --name pulsify-web-1 \
              --restart always \
              -p 8081:80 \
              ${{ secrets.DOCKER_HUB_USERNAME }}/pulsify-frontend:latest
                sudo docker run -d \
              --name pulsify-web-2 \
              --restart always \
              -p 8082:80 \
              ${{ secrets.DOCKER_HUB_USERNAME }}/pulsify-frontend:latest
                sudo docker run -d \
              --name pulsify-web-3 \
              --restart always \
              -p 8083:80 \
              ${{ secrets.DOCKER_HUB_USERNAME }}/pulsify-frontend:latest
            sudo docker image prune -f
