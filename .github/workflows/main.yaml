name: Deploy Pulsify Frontend

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build \
            --build-arg VITE_API_URL="https://pulsify.page/v1" \
            -t ${{ secrets.DOCKER_HUB_USERNAME }}/pulsify-frontend:latest \
            ./my-app
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/pulsify-frontend:latest

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_IP }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/pulsify-frontend:latest
            sudo docker stop pulsify-web || true
            sudo docker rm pulsify-web || true
            sudo docker run -d \
              --name pulsify-web \
              -p 8080:80 \
              ${{ secrets.DOCKER_HUB_USERNAME }}/pulsify-frontend:latest
